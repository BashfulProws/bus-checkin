<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bus Check-in</title>
<style>
  :root{
    --bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#6b7380;--line:#e3e6eb;
    --accent:#0b6b5c;--accent-soft:#dff3ee;--warn:#b42318;--warn-soft:#fde8e6;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1216;--card:#181c22;--ink:#eef1f5;--mute:#98a1ae;--line:#2a303a;
      --accent:#3fcfb4;--accent-soft:#12332d;--warn:#ff8a80;--warn-soft:#3a1d1a;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 8px;font-size:17px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sync{font-size:12px;font-weight:500;color:var(--mute)}
  .sync.bad{color:var(--warn)}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
    padding:8px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2}
  .tab small{display:block;font-weight:500;color:var(--mute);font-size:11px;margin-top:2px}
  .tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab[aria-selected=true] small{color:#ffffffcc}
  @media (prefers-color-scheme:dark){.tab[aria-selected=true]{color:#06231e}.tab[aria-selected=true] small{color:#06231ecc}}
  .route{margin:8px 0 6px;font-size:13px;color:var(--mute)}
  .summary{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .summary b{font-size:22px}
  .summary span{color:var(--mute);font-size:13px}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .tools{display:flex;gap:8px}
  .tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:10px 12px;font:inherit}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:none;color:var(--mute);padding:0 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
  main{padding:10px 14px calc(24px + env(safe-area-inset-bottom))}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li button.row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;
    background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;
    padding:12px;font:inherit;cursor:pointer;min-height:58px}
  li button.row[data-on=true]{background:var(--accent-soft);border-color:var(--accent)}
  li button.row[data-pending=true]{opacity:.6}
  .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--mute);display:grid;place-items:center;color:transparent;font-weight:800}
  .row[data-on=true] .box{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme:dark){.row[data-on=true] .box{color:#06231e}}
  .who{min-width:0;flex:1}
  .who b{display:block;font-weight:600;overflow-wrap:anywhere}
  .who small{color:var(--mute);font-size:12px}
  .tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:4px}
  .msg{text-align:center;color:var(--mute);padding:30px 10px}
  .setup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px}
  .setup input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;margin:8px 0}
  .setup button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
  #toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--warn);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;display:none;max-width:90%;z-index:9}
  [hidden]{display:none!important}
</style>
</head>
<body>

<section class="setup" id="setup" hidden>
  <b>Connect to the sheet</b>
  <p style="margin:6px 0 0;color:var(--mute);font-size:14px">Paste the Apps Script web app URL (ends in <code>/exec</code>). It is saved on this phone only.</p>
  <input id="apiIn" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocomplete="off">
  <button id="apiSave">Save and load</button>
</section>

<div id="app" hidden>
  <header>
    <h1><span>CWTV Field Trip · 1 Nov</span><span class="sync" id="sync">loading…</span></h1>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="route" id="route"></div>
    <div class="summary"><b id="cnt">0 / 0</b><span id="left"></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search name or roll no" autocomplete="off">
      <div class="seg" id="filter">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="todo" aria-pressed="false">Left</button>
        <button data-f="done" aria-pressed="false">Done</button>
      </div>
    </div>
  </header>
  <main><ul id="list"></ul></main>
</div>
<div id="toast" role="status"></div>

<script>
/* Set this once, or leave empty and paste the URL on first open (stored in localStorage). */
const API_URL = "";

const POLL_MS = 15000;
let api = API_URL || safeGet("busCheckinApi") || "";
let cps = [], rows = [], cp = 0, filter = "all", query = "";
const pending = new Set(); // "row:cp" keys with an unconfirmed write

const $ = id => document.getElementById(id);

function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function toast(t){
  const el = $("toast"); el.textContent = t; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(()=>el.style.display="none", 3500);
}

async function call(params){
  const u = api + (api.includes("?") ? "&" : "?") + new URLSearchParams(params);
  const r = await fetch(u, {redirect:"follow"});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "Server error");
  return j;
}

async function load(){
  try{
    const j = await call({action:"list", _:Date.now()});
    cps = j.checkpoints;
    const fresh = j.rows;
    // keep optimistic values for rows with in-flight writes
    fresh.forEach(r=>{
      const old = rows.find(o=>o.row===r.row);
      if(old) for(let i=0;i<cps.length;i++) if(pending.has(r.row+":"+i)) r.checks[i] = old.checks[i];
    });
    rows = fresh;
    setSync("synced " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), false);
    renderTabs(); render();
  }catch(e){
    setSync("offline – retrying", true);
    if(!rows.length) $("list").innerHTML = '<li class="msg">Could not load the sheet. Check the URL and that the web app is deployed for “Anyone”.</li>';
  }
}

function setSync(t,bad){ const s=$("sync"); s.textContent=t; s.className="sync"+(bad?" bad":""); }

function shortTime(label){ const m = label.match(/^\s*(\d{1,2}[:.]\d{2})\s*(.*)$/); return m ? [m[1], m[2]] : [label, ""]; }

function renderTabs(){
  const t = $("tabs");
  t.innerHTML = "";
  cps.forEach((label,i)=>{
    const [time, rest] = shortTime(label);
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", i===cp);
    b.innerHTML = time + "<small></small>";
    b.querySelector("small").textContent = rest.split("→")[0].trim();
    b.onclick = ()=>{ cp = i; renderTabs(); render(); };
    t.appendChild(b);
  });
  $("route").textContent = cps[cp] || "";
}

function render(){
  const total = rows.length;
  const done = rows.filter(r=>r.checks[cp]).length;
  $("cnt").textContent = done + " / " + total;
  $("left").textContent = (total-done) + " still to tick";
  $("barFill").style.width = total ? (100*done/total) + "%" : "0";

  const q = query.trim().toLowerCase();
  const list = rows.filter(r=>{
    if(filter==="todo" && r.checks[cp]) return false;
    if(filter==="done" && !r.checks[cp]) return false;
    return !q || r.name.toLowerCase().includes(q) || r.roll.includes(q);
  });
  const ul = $("list"); ul.innerHTML = "";
  if(!list.length){ ul.innerHTML = '<li class="msg">Nobody matches.</li>'; return; }
  list.forEach(r=>{
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "row";
    b.dataset.on = r.checks[cp];
    b.dataset.pending = pending.has(r.row+":"+cp);
    const note = r.notes ? '<span class="tag"></span>' : "";
    b.innerHTML = '<span class="box">✓</span><span class="who"><b></b><small></small></span>';
    b.querySelector("b").textContent = r.name;
    b.querySelector("small").textContent = r.roll + (r.notes ? " · " + r.notes : "");
    b.onclick = ()=>toggle(r, cp);
    li.appendChild(b); ul.appendChild(li);
  });
}

async function toggle(r, i){
  const key = r.row + ":" + i;
  if(pending.has(key)) return;
  const next = !r.checks[i];
  r.checks[i] = next; pending.add(key); render();
  try{
    await call({action:"set", row:r.row, cp:i, val: next ? 1 : 0});
  }catch(e){
    r.checks[i] = !next;
    toast("Not saved for " + r.name + ". Check signal and tap again.");
  }finally{
    pending.delete(key); render();
  }
}

$("q").addEventListener("input", e=>{ query = e.target.value; render(); });
$("filter").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  filter = b.dataset.f;
  [...$("filter").children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
});

function start(){
  $("setup").hidden = true; $("app").hidden = false;
  load();
  setInterval(()=>{ if(!document.hidden && !pending.size) load(); }, POLL_MS);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(); });
}

if(api){ start(); }
else{
  $("setup").hidden = false;
  $("apiSave").onclick = ()=>{
    const v = $("apiIn").value.trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(v)){ toast("That doesn't look like a /exec web app URL."); return; }
    api = v; safeSet("busCheckinApi", v); start();
  };
}
</script>
</body>
</html>
